---
- name: Validate explicit Docker access policy before making changes
  ansible.builtin.import_tasks: validate_access.yml

- name: Verify supported development platform
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Debian"
      - ansible_distribution_major_version == "13"
      - ansible_architecture == "x86_64"
    fail_msg: "This role currently supports Debian 13 amd64 only"

- name: Remove conflicting Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-doc
      - docker-buildx
      - podman-docker
      - containerd
      - runc
    state: absent

- name: Install Docker repository dependencies
  ansible.builtin.apt:
    name:
      - python3-debian
      - ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - https://download.docker.com/linux/debian
    suites:
      - trixie
    components:
      - stable
    architectures:
      - amd64
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  register: docker_repository

- name: Update APT cache after repository change
  ansible.builtin.apt:
    update_cache: true
  when: docker_repository.changed

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Add selected users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users | default([]) }}"

- name: Read Docker supplementary membership
  ansible.builtin.getent:
    database: group
    key: docker
    fail_key: false
  when: docker_revoked_users | length > 0

- name: Read accounts with explicitly revoked Docker access
  ansible.builtin.getent:
    database: passwd
    key: "{{ item }}"
    fail_key: false
  loop: "{{ docker_revoked_users }}"
  register: docker_revoked_accounts

- name: Refuse to change a revoked user's primary group implicitly
  ansible.builtin.assert:
    that:
      - >-
        not ansible_facts.getent_group.docker or
        not item.ansible_facts.getent_passwd[item.item] or
        item.ansible_facts.getent_passwd[item.item][2] != ansible_facts.getent_group.docker[1]
    fail_msg: >-
      {{ item.item }} uses docker as its primary group. Assign an appropriate
      primary group explicitly before revoking Docker access.
  loop: "{{ docker_revoked_accounts.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Report Docker memberships that would be revoked
  ansible.builtin.debug:
    msg: "Would remove {{ item }} from the docker supplementary group"
  loop: "{{ docker_revoked_users }}"
  when:
    - ansible_check_mode
    - ansible_facts.getent_group.docker is not none
    - item in ansible_facts.getent_group.docker[2].split(',')
  changed_when: true

- name: Remove explicitly revoked Docker supplementary memberships
  ansible.builtin.command:
    argv:
      - gpasswd
      - --delete
      - "{{ item }}"
      - docker
  loop: "{{ docker_revoked_users }}"
  when:
    - not ansible_check_mode
    - ansible_facts.getent_group.docker is not none
    - item in ansible_facts.getent_group.docker[2].split(',')
  changed_when: true
