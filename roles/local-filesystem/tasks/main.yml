---
- name: Install ext4 filesystem tools
  ansible.builtin.apt:
    name: e2fsprogs
    state: present
  when: local_filesystems | length > 0

- name: Check local filesystem devices
  ansible.builtin.stat:
    path: "{{ item.device }}"
    follow: true
  loop: "{{ local_filesystems }}"
  register: local_filesystem_devices

- name: Require every configured local filesystem device
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isblk | default(false)
    fail_msg: >-
      {{ item.item.device }} is not a block device. Check the persistent
      /dev/disk/by-id path before continuing; do not substitute an unverified
      /dev/sdX name.
  loop: "{{ local_filesystem_devices.results }}"
  loop_control:
    label: "{{ item.item.device }}"

- name: Read existing filesystem types
  ansible.builtin.command:
    argv:
      - blkid
      - -o
      - value
      - -s
      - TYPE
      - "{{ item.device }}"
  loop: "{{ local_filesystems }}"
  register: local_filesystem_types
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read existing filesystem labels before any resize
  ansible.builtin.command:
    argv:
      - blkid
      - -o
      - value
      - -s
      - LABEL
      - "{{ item.device }}"
  loop: "{{ local_filesystems }}"
  register: local_filesystem_labels
  changed_when: false
  failed_when: false
  check_mode: false

- name: Validate existing filesystem identities before mutation
  ansible.builtin.import_tasks: validate.yml

- name: Explain blank filesystem predictions in check mode
  ansible.builtin.debug:
    msg: >-
      {{ item.item.device }} is blank. Check mode predicts creation but cannot
      verify the future label, mount, permissions, or filesystem growth.
  loop: "{{ local_filesystem_types.results }}"
  when:
    - ansible_check_mode
    - item.rc == 2

- name: Create or grow local filesystems
  community.general.filesystem:
    dev: "{{ item.device }}"
    fstype: "{{ item.fstype }}"
    opts: "-L {{ item.label }}"
    resizefs: true
    force: false
    state: present
  loop: "{{ local_filesystems }}"

- name: Verify labels after real filesystem creation
  ansible.builtin.command:
    argv:
      - blkid
      - -o
      - value
      - -s
      - LABEL
      - "{{ item.device }}"
  loop: "{{ local_filesystems }}"
  register: local_filesystem_created_labels
  changed_when: false
  failed_when: >-
    local_filesystem_created_labels.rc != 0 or
    local_filesystem_created_labels.stdout != item.label
  when: not ansible_check_mode

- name: Configure and mount local filesystems
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "LABEL={{ item.label }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.opts | default('defaults') }}"
    dump: "0"
    passno: "2"
    state: mounted
  loop: "{{ local_filesystems }}"

- name: Set local filesystem root permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ local_filesystems }}"
