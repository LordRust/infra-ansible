---
- name: Install NFS server
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present

- name: Create NFS exports directory
  ansible.builtin.file:
    path: /etc/exports.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Require exported paths to be mounted filesystems
  ansible.builtin.command:
    argv:
      - mountpoint
      - --quiet
      - "{{ item.path }}"
  loop: "{{ nfs_exports }}"
  changed_when: false
  check_mode: false
  register: nfs_server_mountpoint
  failed_when: >-
    nfs_server_mountpoint.rc != 0 and not
    (ansible_check_mode and nfs_server_mountpoint.rc in [1, 32] and
     item.path in (local_filesystems | default([]) | map(attribute='path') | list))

- name: Explain mounts that check mode cannot create
  ansible.builtin.debug:
    msg: >-
      {{ item.item.path }} would be mounted by local-filesystem. Check mode
      cannot validate its future export; a real run must pass the mount guard.
  loop: "{{ nfs_server_mountpoint.results }}"
  when:
    - ansible_check_mode
    - item.rc != 0

- name: Remove managed exports from the legacy exports file
  ansible.builtin.lineinfile:
    path: /etc/exports
    regexp: "^\\s*{{ item.path | regex_escape }}\\s+"
    state: absent
  loop: "{{ nfs_exports }}"
  notify: Reload NFS exports

- name: Configure NFS exports
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports.d/ansible.exports
    owner: root
    group: root
    mode: "0644"
  notify: Reload NFS exports

- name: Enable and start NFS server
  ansible.builtin.service:
    name: nfs-kernel-server
    enabled: true
    state: started
