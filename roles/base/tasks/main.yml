---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - git
      - tmux
      - htop
      - curl
      - ca-certificates
      - sudo
    state: present
    update_cache: true

- name: Ensure supplementary groups exist
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid }}"
    state: present
  loop: "{{ managed_groups }}"

- name: Ensure user primary groups exist
  ansible.builtin.group:
    name: "{{ item.primary_group }}"
    gid: "{{ item.primary_gid }}"
    state: present
  loop: "{{ managed_users }}"

- name: Ensure users exist with correct UID/GID
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.primary_group }}"
    groups: "{{ item.groups | default(omit) }}"
    append: "{{ (item.groups | default([]) | length) > 0 }}"
    shell: /bin/bash
    create_home: true
    state: present
  loop: "{{ managed_users }}"

- name: Install SSH authorized keys
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
    state: present
  loop: "{{ managed_users | subelements('ssh_keys', skip_missing=True) }}"

- name: Configure passwordless sudo users
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ansible-sudo-users
    content: |
      {% for user in sudo_users %}
      {{ user }} ALL=(ALL:ALL) NOPASSWD: ALL
      {% endfor %}
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
