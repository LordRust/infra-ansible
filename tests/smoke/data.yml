---
- name: Exercise NFS writes and preserve an existing data marker
  hosts: smoke_devhosts
  gather_facts: false
  become: true
  pre_tasks:
    - name: Check disposable target
      ansible.builtin.import_tasks: guard.yml
    - name: Require real execution for the data scenario
      ansible.builtin.assert:
        that: not ansible_check_mode
        fail_msg: "Run after provisioning; this scenario writes only the disposable NFS marker."
    - name: Check disposable export before NFS data operations
      ansible.builtin.import_tasks: export-ready.yml
  tasks:
    - name: Write marker as the unprivileged NFS identity without replacing existing data
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - smoke-user
          - --
          - sh
          - -c
          - >-
            if test -e /smoke-fs/rebuild-marker; then
              printf 'existing\n';
            else
              printf '%s\n' 'infra-ansible smoke data survives' > /smoke-fs/rebuild-marker &&
              printf 'created\n';
            fi
      register: smoke_marker_write
      changed_when: smoke_marker_write.stdout == 'created'

    - name: Read the preserved marker
      ansible.builtin.command:
        argv: [runuser, -u, smoke-user, --, cat, --, /smoke-fs/rebuild-marker]
      register: smoke_marker
      changed_when: false

    - name: Verify data survived and NFS identity can write
      ansible.builtin.assert:
        that: (smoke_marker.stdout | trim) == 'infra-ansible smoke data survives'
