nfs_mounts:
  - path: /fs1
    src: rs-fs1.lunarc.lu.se:/disk
  - path: /fs2
    src: rs-fs2.lunarc.lu.se:/disk
  - path: /fs3
    src: "{{ hostvars['infra-fs-01'].ansible_host }}:/srv/fs3"
    opts: rw,_netdev,x-systemd.automount,nofail
  - path: /access
    src: mtlucmds1.lund.skane.se:/access
  - path: /data
    src: mtlucmds1.lund.skane.se:/data
